<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- jQuery (available globally for config UI and future use) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-semibold">MyDashboard</span>
    <div class="d-flex align-items-center gap-2">
      <span id="last-updated" class="text-white-50 small"></span>
      <button id="refresh-btn" class="btn btn-sm btn-outline-light" title="Refresh data">&#x21BB;</button>
    </div>
  </nav>

  <div class="container-fluid p-3">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-3">

      <!-- Clock -->
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-section-title">Clock</h6>
            <div id="clock-date" class="clock-date"></div>
            <div class="clock-zones" id="clock-zones"></div>
          </div>
        </div>
      </div>

      <!-- Weather -->
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-section-title">Weather</h6>
            <div id="weather-list"></div>
          </div>
        </div>
      </div>

      <!-- Crypto -->
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-section-title">Crypto</h6>
            <div class="ticker-list" id="crypto-list"></div>
          </div>
        </div>
      </div>

      <!-- Global Markets -->
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-section-title">Global Markets</h6>
            <div class="ticker-list" id="indices-global-list"></div>
          </div>
        </div>
      </div>

      <!-- Forex vs GBP -->
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="card-section-title">Forex <span class="fw-normal text-lowercase ms-1" style="font-size:0.8em;">vs GBP</span></h6>
            <div class="ticker-list" id="forex-gbp-list"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
